name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopstop
          POSTGRES_PASSWORD: shopstop
          POSTGRES_DB: shopstop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopstop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopstop:shopstop@localhost:5432/shopstop?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup errors out when a version
      # is given alongside package.json's "packageManager", and that field is the
      # canonical pin everything else (corepack, the Dockerfiles) already follows.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Unit tests
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopstop
          POSTGRES_PASSWORD: shopstop
          POSTGRES_DB: shopstop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopstop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopstop:shopstop@localhost:5432/shopstop?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000
      OTP_DEV_LOG: 'true'
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup errors out when a version
      # is given alongside package.json's "packageManager", and that field is the
      # canonical pin everything else (corepack, the Dockerfiles) already follows.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate + seed
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          NODE_ENV=development pnpm exec ts-node --transpile-only prisma/seed.ts
      - name: Build + start API
        working-directory: apps/api
        run: |
          pnpm build
          node dist/main.js &
          for i in $(seq 1 30); do
            curl -sf localhost:4000/api/v1/health/ready && break || sleep 1
          done
      - name: Run E2E flows
        working-directory: apps/api
        run: |
          node test/e2e/commerce.e2e.mjs
          node test/e2e/trust.e2e.mjs
          node test/e2e/notification-preferences.e2e.mjs
          node test/e2e/revenue.e2e.mjs
          node test/e2e/boosts.e2e.mjs
          node test/e2e/subscriptions.e2e.mjs
          node test/e2e/funnel.e2e.mjs
          node test/e2e/questions.e2e.mjs
          node test/e2e/feature-flags.e2e.mjs
          node test/e2e/read-receipts.e2e.mjs

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (high+)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high || true # report, do not block yet
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - name: Static analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript p/nodejsscan p/owasp-top-ten
        continue-on-error: true
      # Phase 7+ also adds: Trivy (container image scan) once images publish, and
      # OWASP ZAP (DAST) against the ephemeral e2e stack. See docs/13 + docs/15.
