name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopstop
          POSTGRES_PASSWORD: shopstop
          POSTGRES_DB: shopstop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shopstop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://shopstop:shopstop@localhost:5432/shopstop?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate + migrate
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm -r lint
      - name: Unit tests
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (high+)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high || true # report, do not block yet
      # Phase 7 adds: CodeQL/Semgrep (SAST), Trivy (container/image), gitleaks (secrets),
      # and OWASP ZAP (DAST) against an ephemeral stack. See docs/13 + docs/15.
