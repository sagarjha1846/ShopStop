name: Release images

# Builds the API and web images and publishes them to GitHub Container Registry.
# Uses the workflow's built-in GITHUB_TOKEN — no registry secrets to configure,
# so this runs on a fresh clone of the repo with nothing set up.
#
# Pull them with:
#   docker pull ghcr.io/<owner>/shopstop/api:latest
#   docker pull ghcr.io/<owner>/shopstop/web:latest

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names and this repo has a capital letter
      # in its name, so github.repository can't be used verbatim.
      - name: Resolve image name
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The container scan docs/13 called for "once images publish" — they now do.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
        continue-on-error: true

      # Code scanning needs Advanced Security on private repos; don't fail the
      # release if the upload isn't available.
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}
        continue-on-error: true

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.app }} image published"
            echo ''
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo ''
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
