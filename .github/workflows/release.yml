name: Release images

# Builds the API and web images and publishes them to GitHub Container Registry.
# Uses the workflow's built-in GITHUB_TOKEN — no registry secrets to configure,
# so this runs on a fresh clone of the repo with nothing set up.
#
# Pull them with:
#   docker pull ghcr.io/<owner>/shopstop/api:<branch-or-sha-tag>
#   docker pull ghcr.io/<owner>/shopstop/web:<branch-or-sha-tag>
#
# Note the tag: `latest` is only applied on the default branch (see the tags
# block below), so on a feature branch the published tags are the branch name
# and `sha-<full-commit>`. Pulling `:latest` before anything reaches main fails
# with "manifest unknown".

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names and this repo has a capital letter
      # in its name, so github.repository can't be used verbatim.
      - name: Resolve image name
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # The container scan docs/13 called for "once images publish" — they now do.
      # Run from Trivy's own image rather than a marketplace action: an action
      # that can't be resolved fails the job during setup, before the image is
      # ever built, which is a poor trade for a non-blocking scan.
      - name: Scan image (Trivy)
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format table \
              '${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}' | tee trivy.txt
          {
            echo "### Trivy — ${{ matrix.app }} (HIGH/CRITICAL, fixable)"
            echo '```'
            tail -c 8000 trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.app }} image published"
            echo ''
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo ''
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Does the artifact we just published actually run? Building and pushing an
  # image only proves it compiled. This pulls the pushed images the way an
  # operator would and drives real endpoints against them, so a broken deploy is
  # caught here rather than on someone's server. The API Dockerfile migrates on
  # boot, so this also exercises `prisma migrate deploy` against an empty database.
  deploy-smoke:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Pin to this commit's tag, not the branch tag: the branch tag is mutable and
      # a concurrent push would have the smoke test grade the wrong image.
      - name: Resolve image coordinates
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=sha-${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Write deploy env
        run: |
          cat > .env.deploy <<'ENV'
          DATABASE_URL=postgresql://shopstop:shopstop@db:5432/shopstop?schema=public
          REDIS_URL=redis://redis:6379
          JWT_ACCESS_SECRET=smoke-access-secret-0000000000000
          JWT_REFRESH_SECRET=smoke-refresh-secret-000000000000
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          WEB_BASE_URL=http://localhost:3000
          EMAIL_FROM=smoke@example.com
          ENV
          echo "IMAGE_OWNER=$IMAGE_OWNER" >> .env.deploy
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env.deploy

      - name: Start the published stack
        run: |
          docker compose -f docker-compose.deploy.yml -f ops/docker-compose.smoke.yml \
            --env-file .env.deploy up -d api web redis db

      # Generous, because this is a cold start: pull the image, wait for Postgres to
      # accept connections, run `prisma migrate deploy` against an empty database,
      # then boot Nest. 60s was not enough and the step died mid-migration.
      - name: Wait for the API to come up
        run: |
          for i in $(seq 1 180); do
            if curl -sf localhost:4000/api/v1/health/ready >/dev/null; then
              echo "api ready after ${i}s"; exit 0
            fi
            [ $((i % 15)) -eq 0 ] && echo "still waiting (${i}s)..."
            sleep 1
          done
          echo "API never became ready"; exit 1

      - name: Drive the running images
        run: |
          set -euo pipefail
          fail() { echo "SMOKE FAIL: $1"; exit 1; }

          # Migrations ran against an empty database if the seeded-free schema serves.
          curl -sf localhost:4000/api/v1/categories >/dev/null || fail "categories did not serve"

          # A real write through Argon2 + Postgres + Redis session storage.
          EMAIL="smoke_$(date +%s)@example.com"
          TOKEN=$(curl -sf -X POST localhost:4000/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"smokepass12345\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])') || fail "register failed"

          # The payables/payout SQL is hand-written and the most likely thing to
          # break against a freshly migrated schema, so hit it rather than assume.
          curl -sf localhost:4000/api/v1/me/payouts -H "authorization: Bearer $TOKEN" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["heldMinor"]==0,d' || fail "payout view broke"

          # RBAC is wired in the running image, not just in tests.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/api/v1/admin/payables \
            -H "authorization: Bearer $TOKEN")
          [ "$CODE" = "403" ] || fail "admin payables returned $CODE for a normal user, expected 403"

          # And the web image serves its shell against the API container.
          curl -sf -o /dev/null localhost:3000/login || fail "web did not serve /login"

          # The browser talks to the API through the web origin, and next.config's
          # rewrite is baked at build time — so this is the assertion that catches a
          # web image built pointing at the wrong API host. Serving /login would not:
          # that renders fine while every API call from the page proxies into a void.
          curl -sf -o /dev/null localhost:3000/api/v1/categories \
            || fail "web could not reach the API through its own /api rewrite"
          echo "smoke passed against $IMAGE_TAG"

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.deploy.yml -f ops/docker-compose.smoke.yml --env-file .env.deploy logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.deploy.yml -f ops/docker-compose.smoke.yml --env-file .env.deploy down -v
