# Run ShopStop from the images published to GHCR by .github/workflows/release.yml.
# Unlike docker-compose.prod.yml this builds nothing — it pulls, so it runs on any
# Docker host without the source tree.
#
#   export IMAGE_OWNER=<your-github-owner-lowercase>
#   export IMAGE_TAG=<branch-name>     # see below — `latest` does not exist yet
#   docker login ghcr.io -u <user> -p <token-with-read:packages>   # private repos only
#   docker compose -f docker-compose.deploy.yml --env-file .env.deploy up -d
#
# On IMAGE_TAG: release.yml only tags `latest` on the default branch, so until
# this work merges to main the only tags that exist are the branch name and
# `sha-<full-commit>`. Pulling `latest` today fails with "manifest unknown".
# List what is actually published:
#   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:$IMAGE_OWNER/shopstop/api:pull&service=ghcr.io" | jq -r .token)
#   curl -s -H "Authorization: Bearer $TOKEN" https://ghcr.io/v2/$IMAGE_OWNER/shopstop/api/tags/list | jq .tags
#
# Postgres is intentionally NOT included: run a managed instance and point
# DATABASE_URL at it. The API applies migrations on boot.
services:
  api:
    image: ghcr.io/${IMAGE_OWNER}/shopstop/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEB_BASE_URL: ${WEB_BASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      CDN_BASE_URL: ${CDN_BASE_URL}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-200}
      BOOST_PRICE_PER_DAY_MINOR: ${BOOST_PRICE_PER_DAY_MINOR:-4900}
      MDR_CARD_BPS: ${MDR_CARD_BPS:-200}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - '4000'

  web:
    image: ghcr.io/${IMAGE_OWNER}/shopstop/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_CDN_BASE_URL: ${CDN_BASE_URL}
    depends_on:
      - api
    expose:
      - '3000'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  redisdata:
  caddydata:
  caddyconfig:
